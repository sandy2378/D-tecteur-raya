<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détecteur de Trésor Raya</title>
    <style>
        body { 
            background-color: #008080; /* Turquoise */
            color: white; 
            text-align: center; 
            font-family: 'Segoe UI', Arial, sans-serif;
            padding-top: 50px;
        }
        .circle { 
            width: 220px; 
            height: 220px; 
            border-radius: 50%; 
            background: radial-gradient(circle, #ff007f, #40e0d0); /* Rose vers Turquoise */
            margin: 30px auto; 
            border: 8px solid #ffffff;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        button { 
            padding: 15px 30px; 
            font-size: 20px; 
            border-radius: 50px; 
            border: none; 
            background: #ff007f; /* Rose */
            color: white; 
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #status { font-size: 22px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Détecteur de Trésor</h1>
    
    <div class="circle" id="force">0</div>
    
    <p id="status">Prêt pour la recherche...</p>
    <br>
    <button onclick="demarrerScan()">ACTIVER LE CAPTEUR</button>

    <script>
    let intervalle = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function biper(frequence) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = frequence;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            osc.stop(audioCtx.currentTime + 0.1);
        } catch (e) {
            console.log("Erreur audio : ", e);
        }
    }

    function demarrerScan() {
        if (intervalle) {
            clearInterval(intervalle);
            intervalle = null;
            document.getElementById('status').innerHTML = "Détection arrêtée.";
            document.body.style.backgroundColor = "#008080";
            return;
        }

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        document.getElementById('status').innerHTML = "Recherche en cours...";
        
        intervalle = setInterval(() => {
            let detection = Math.floor(Math.random() * 100); 
            document.getElementById('force').innerHTML = detection;

            if(detection > 85) {
                document.getElementById('status').innerHTML = "⚠️ MÉTAL DÉTECTÉ !";
                document.body.style.backgroundColor = "#FFD700"; // Couleur Or
                document.getElementById('force').style.transform = "scale(1.2)";
                biper(800); 
            } else {
                document.getElementById('status').innerHTML = "Recherche en cours...";
                document.body.style.backgroundColor = "#008080"; 
                document.getElementById('force').style.transform = "scale(1.0)";
                if(detection > 60) {
                    biper(400); 
                }
            }
        }, 500);
    }
        let sensor = new Magnetometer({frequency: 10});
sensor.addEventListener('reading', () => {
    // On utilise la force magnétique totale (X, Y, Z)
    let forceReelle = Math.sqrt(sensor.x**2 + sensor.y**2 + sensor.z**2);
    document.getElementById('force').innerHTML = Math.floor(forceReelle);
});
sensor.start();

    </script>
</body>
</html>
